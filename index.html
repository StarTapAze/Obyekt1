<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linklərim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1710;
    --paper: #faf6ee;
    --card: #ffffff;
    --gold: #c8863a;
    --gold-soft: #f0dcc0;
    --line: rgba(28,23,16,0.10);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #f3ede1;
      --paper: #17140f;
      --card: #201b14;
      --gold: #e3a35c;
      --gold-soft: #3a2f1e;
      --line: rgba(243,237,225,0.12);
    }
  }
  :root[data-theme="dark"] {
    --ink: #f3ede1;
    --paper: #17140f;
    --card: #201b14;
    --gold: #e3a35c;
    --gold-soft: #3a2f1e;
    --line: rgba(243,237,225,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 50% -10%, var(--gold-soft) 0%, transparent 55%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 72px 20px 48px;
  }

  .page {
    width: 100%;
    max-width: 420px;
  }

  .avatar-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(155deg, var(--gold), #a8642a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 500;
    color: #fff;
    overflow: hidden;
    box-shadow: 0 8px 24px -6px rgba(200,134,58,0.45);
    border: 3px solid var(--paper);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 32px;
    text-align: center;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .bio {
    text-align: center;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    opacity: 0.65;
    margin: 0 auto 40px;
    max-width: 300px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .link-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 17px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    box-shadow: 0 1px 2px rgba(28,23,16,0.04);
  }

  .link-row:hover,
  .link-row:focus-visible {
    transform: translateY(-2px);
    border-color: var(--gold);
    box-shadow: 0 10px 24px -10px rgba(200,134,58,0.35);
  }
  .link-row:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .link-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    color: var(--gold);
  }

  .link-label {
    font-size: 15.5px;
    font-weight: 500;
    flex: 1;
  }

  .link-arrow {
    opacity: 0.35;
    font-size: 15px;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .link-row:hover .link-arrow {
    opacity: 0.9;
    transform: translateX(2px);
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12.5px;
    opacity: 0.4;
    letter-spacing: 0.02em;
  }

  .powered-by {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 16px;
    padding: 9px 16px;
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--gold);
    opacity: 1;
  }

  .powered-by svg {
    width: 17px;
    height: 17px;
  }

  .brand-logo {
    display: block;
    height: 52px;
    width: auto;
    margin: 16px auto 0;
    opacity: 1;
  }

  @media (max-width: 380px) {
    body { padding: 56px 16px 40px; }
    h1 { font-size: 27px; }
  }
</style>
</head>
